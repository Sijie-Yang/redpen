<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redpen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22%3E%3Crect width=%22128%22 height=%22128%22 rx=%2228%22 fill=%22%23E5372B%22/%3E%3Cpath d=%22M19 99q7-11 14 0t14 0t14-1q4-5 9-6%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%227%22 stroke-linecap=%22round%22/%3E%3Cg transform=%22translate(90 60) rotate(35) scale(.9)%22%3E%3Cpath d=%22M-12-40a8 8 0 0 1 8-8h8a8 8 0 0 1 8 8v54l-12 27l-12-27z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M-4.6 30.6h9.2l-4.6 10.4z%22 fill=%22%238E1B13%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--rv:#6B3FD4;--rv-l:#EFE9FB}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#1B2333;background:#2B303B}
body{display:flex;flex-direction:column}
#rv-top{flex:none;min-height:54px;background:#161C28;color:#E8EBF0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;line-height:1.2}
#rv-top b{font-size:15px;margin-right:2px;white-space:nowrap}
#rv-top button{border:1px solid #3A465A;background:#232C3C;color:#E8EBF0;border-radius:7px;padding:7px 10px;font:inherit;cursor:pointer;white-space:nowrap}
#rv-top button small{opacity:.55;font-size:11px;margin-left:3px}
#rv-top button:hover{background:#2E3A50}
#rv-top button.on{background:var(--rv);border-color:var(--rv)}
#rv-top button:disabled{opacity:.35;cursor:default}
#rv-top .rv-grp{display:flex;gap:4px;align-items:center}
#rv-hint{color:#9FB0C8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 220px}
#rv-page{min-width:96px;text-align:center;color:#C9D3E2;white-space:nowrap}
#rv-main{flex:1;min-height:0;display:flex}
#rv-stage{flex:1;min-width:0;position:relative;background:#2B303B}
#rv-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#rv-side{flex:none;width:clamp(320px,34vw,430px);background:#F5F6F9;border-left:1px solid #D5DAE3;display:flex;flex-direction:column}
body.noside #rv-side{display:none}
body.present #rv-top,body.present #rv-side{display:none}
body.present #rv-stage,body.present{background:#000}
#rv-toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:95;background:rgba(22,28,40,.92);color:#fff;border-radius:10px;padding:10px 18px;font-size:15px;white-space:nowrap;display:none;pointer-events:none}
.rv-tabs{display:flex;border-bottom:1px solid #D5DAE3;flex:none}
.rv-tabs button{flex:1;border:0;background:none;padding:11px 0;font:inherit;font-weight:600;color:#6B7688;cursor:pointer;border-bottom:3px solid transparent}
.rv-tabs button.on{color:var(--rv);border-bottom-color:var(--rv)}
#rv-body{flex:1;overflow:auto;padding:12px 14px 30px}
#rv-foot{flex:none;border-top:1px solid #D5DAE3;background:#fff;padding:9px 12px}
#rv-status{color:#6B7688;font-size:12.5px;line-height:1.35;word-break:break-all} #rv-status.ok{color:#2E7D4F} #rv-status.err{color:#C94B3E}
#rv-status a{color:var(--rv);cursor:pointer;text-decoration:underline}
#rv-foot .rv-grp{display:flex;gap:6px;margin-top:7px}
#rv-foot .rv-grp button{flex:1;border:1px solid #CBD2DE;background:#fff;border-radius:7px;padding:7px 4px;font:inherit;font-size:13px;cursor:pointer;color:#1B2333;white-space:nowrap}
#rv-foot .rv-grp button:hover{border-color:var(--rv);color:var(--rv)}
#rv-foot .rv-grp button.pri{background:var(--rv);border-color:var(--rv);color:#fff;flex:1.5}
.rv-slidehead{font-size:13px;color:#6B7688;margin-bottom:8px} .rv-slidehead b{color:#1B2333;font-size:15px;margin-right:6px}
.rv-acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rv-acts button,.rv-acts select{border:1px solid #CBD2DE;background:#fff;border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;cursor:pointer;color:#1B2333}
.rv-acts button:hover,.rv-acts select:hover{border-color:var(--rv);color:var(--rv)}
.rv-notes{background:#fff;border:1px solid #D5DAE3;border-radius:8px;padding:7px 10px;margin-bottom:10px;font-size:13px}
.rv-notes-setting{display:flex;align-items:center;gap:7px;margin:0 0 7px;font-size:13px;color:#4A5568;cursor:pointer}
.rv-notes-setting input{margin:0;accent-color:var(--rv)}
.rv-notes summary{cursor:pointer;color:#6B7688} .rv-notes div{margin-top:6px;white-space:pre-wrap;color:#333D4F;max-height:220px;overflow:auto}
.rv-notes.pinned div{max-height:min(55vh,520px)}
.rv-card{background:#fff;border:1px solid #D5DAE3;border-radius:10px;padding:10px 11px;margin-bottom:10px}
.rv-card.sel{border-color:var(--rv);box-shadow:0 0 0 2px var(--rv-l)}
.rv-h{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.rv-num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--rv);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rv-type{font-weight:600;font-size:13px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-card select{font:inherit;font-size:12px;border:1px solid #CBD2DE;border-radius:6px;padding:3px 4px;background:#fff;max-width:100%}
.rv-x{border:0;background:none;color:#9AA4B4;cursor:pointer;font-size:13px;padding:2px 4px;flex:none} .rv-x:hover{color:#C94B3E}
.rv-star{border:0;background:none;cursor:pointer;font-size:15px;color:#C5CCD8;padding:0 2px;flex:none} .rv-star.on{color:#E8A20C}
.rv-q{font-size:13px;color:#4A5568;border-left:3px solid #E2C94B;background:#FFFBEA;padding:5px 8px;margin-bottom:7px;border-radius:0 6px 6px 0;max-height:96px;overflow:auto}
.rv-t{font-size:12px;color:#7A8597;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;font-size:12px;color:#7A8597}
.rv-row select{flex:1;min-width:0}
.rv-card textarea,.rv-card input[type=text],#rv-general{width:100%;border:1px solid #CBD2DE;border-radius:7px;padding:7px 9px;font:inherit;resize:vertical;background:#fff;color:#1B2333;margin-bottom:6px}
.rv-card textarea:focus,.rv-card input:focus,#rv-general:focus{outline:2px solid var(--rv-l);border-color:var(--rv)}
.rv-l{display:block;font-size:12px;color:#7A8597;margin-bottom:3px}
.rv-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.rv-chips button{border:1px solid #DDD6F3;background:#F7F4FD;color:#5A3BB0;border-radius:12px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}
.rv-chips button:hover{background:var(--rv);color:#fff;border-color:var(--rv)}
.rv-tog{border:1px solid #CBD2DE;background:#fff;border-radius:6px;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer;color:#6B7688}
.rv-tog.on{background:var(--rv-l);border-color:var(--rv);color:var(--rv)}
.rv-imgs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-thumb{position:relative;width:74px;height:54px;border-radius:6px;overflow:hidden;border:1px solid #CBD2DE;background:#EEF1F5;font-size:11px;color:#7A8597;display:flex;align-items:center;justify-content:center}
.rv-thumb.big{width:100%;height:auto;max-height:190px} .rv-thumb.big img{object-fit:contain;max-height:190px}
.rv-thumb img{width:100%;height:100%;object-fit:cover}
.rv-thumb button{position:absolute;right:1px;top:1px;border:0;border-radius:50%;width:18px;height:18px;line-height:16px;background:rgba(22,28,40,.75);color:#fff;font-size:12px;cursor:pointer;padding:0}
.rv-add{font-size:12px;color:var(--rv);cursor:pointer;border:1px dashed #BDB0E6;border-radius:6px;padding:6px 9px}
.rv-add input{display:none}
.rv-card.drop{outline:2px dashed var(--rv)}
.rv-empty{color:#7A8597;font-size:13px;padding:14px 6px;line-height:1.75}
.rv-banner{background:#FFF4E5;border:1px solid #F0C98A;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.rv-banner a{color:var(--rv);cursor:pointer;text-decoration:underline}
.rv-out{list-style:none;margin:10px 0 0;padding:0}
.rv-out li{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.rv-out li:hover{background:#E9ECF2} .rv-out li.cur{background:var(--rv-l)}
.rv-out li .n{flex:none;width:52px;color:#7A8597;font-variant-numeric:tabular-nums}
.rv-out li .c{margin-left:auto;flex:none;background:var(--rv);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.rv-out li.gone .ti{text-decoration:line-through;color:#9AA4B4}
.rv-out li.ghost{color:var(--rv);cursor:default} .rv-out li.ghost:hover{background:none}
.rv-flag{font-size:11px;color:#C94B3E;border:1px solid #E7B3AC;border-radius:5px;padding:0 5px;flex:none}
.rv-last{background:#fff;border:1px solid #D5DAE3;border-radius:10px;padding:9px 11px;margin-bottom:9px;font-size:13px}
.rv-last .w{color:#7A8597;font-size:12px;margin-bottom:4px}
.rv-reply{margin-top:6px;border-left:3px solid #2E7D4F;background:#EEF7F1;padding:5px 8px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.rv-reply.no{border-left-color:#C94B3E;background:#FCEFED} .rv-reply.none{border-left-color:#C5CCD8;background:#F3F4F7;color:#7A8597}
#rv-help{position:fixed;inset:0;z-index:90;background:rgba(15,20,30,.55);display:none;align-items:center;justify-content:center;line-height:1.6}
#rv-help>div{background:#fff;border-radius:12px;padding:22px 26px;max-width:760px;max-height:88vh;overflow:auto;margin:14px}
#rv-help h3{margin:0 0 8px;font-size:17px} #rv-help table{border-collapse:collapse;width:100%} #rv-help td{padding:4px 8px;border-bottom:1px solid #EEF0F4;vertical-align:top;font-size:13.5px}
#rv-help td:first-child{white-space:nowrap;font-weight:600} #rv-help kbd{border:1px solid #CBD2DE;border-radius:4px;padding:0 5px;font:12px ui-monospace,Menlo,monospace;background:#F5F6F9}
#rv-help code{background:#F5F6F9;border-radius:4px;padding:1px 5px;font:12px ui-monospace,Menlo,monospace;word-break:break-all}
@media (max-width:820px){#rv-side{width:300px}}
html[lang=en] #rv-status{word-break:normal;overflow-wrap:anywhere}
html[lang=en] .rv-acts select{max-width:120px}
</style>
</head>
<body>
<div id="rv-top"></div>
<div id="rv-main">
  <div id="rv-stage"><iframe id="rv-frame" title="document under review"></iframe></div>
  <div id="rv-side">
    <div class="rv-tabs"></div>
    <div id="rv-body"></div>
    <div id="rv-foot"><div id="rv-status"></div>
      <div class="rv-grp"><button data-do="prompt" class="pri">复制给 AI 的指令</button><button data-do="copy">复制标注文字</button><button data-do="clear">归档并清空</button></div>
    </div>
  </div>
</div>
<div id="rv-help"></div>
<input type="file" id="rv-file" accept="image/*,.pdf" multiple hidden>
<script src="app.js"></script>
</body>
</html>
